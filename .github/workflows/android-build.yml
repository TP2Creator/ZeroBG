name: Build ZeroBG APK

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build production debug APK
        run: gradle assembleProductionDebug

      - name: Prepare APK
        shell: bash
        run: |
          set -euo pipefail

          APK_PATH="$(find app/build/outputs/apk -type f -name '*.apk' \
            | grep '/production/debug/' | head -n 1)"

          if [ -z "$APK_PATH" ]; then
            echo "Production APK was not found."
            find app/build/outputs/apk -type f -name '*.apk' || true
            exit 1
          fi

          mkdir -p release
          cp "$APK_PATH" release/ZeroBG.apk

      - name: Package source ZIP
        run: |
          git archive --format=zip --output=release/ZeroBG-source.zip HEAD

      - name: Upload APK and source ZIP
        uses: actions/upload-artifact@v4
        with:
          name: ZeroBG-downloads
          path: release/*
          if-no-files-found: error
          retention-days: 7

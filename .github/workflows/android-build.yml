name: Build ZeroBG APK

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build production APK
        run: gradle assembleProductionDebug

      - name: Prepare APK and source ZIP
        run: |
          APK_PATH="$(find app/build/outputs/apk -type f -name '*.apk' | grep '/production/debug/' | head -n 1)"
          test -n "$APK_PATH"
          cp "$APK_PATH" ZeroBG.apk
          zip -r ZeroBG-source.zip . \
            -x ".git/*" "*/build/*" ".gradle/*" \
               "local.properties" "*.bak"

      - name: Upload ZeroBG files
        uses: actions/upload-artifact@v4
        with:
          name: ZeroBG-downloads
          path: |
            ZeroBG.apk
            ZeroBG-source.zip
          if-no-files-found: error
          retention-days: 7
